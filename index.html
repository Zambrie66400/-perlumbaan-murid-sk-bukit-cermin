<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perlumbaan Murid SK Bukit Cermin 2025</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 20px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #98FB98 100%);
            min-height: 100%;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2563eb;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #dc2626;
            font-weight: bold;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f0f9ff;
            border-radius: 15px;
            border: 3px solid #3b82f6;
        }

        .control-section {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e5e7eb;
        }

        .control-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .icon-selector {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }

        .icon-option {
            padding: 8px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .icon-option:hover {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .icon-option.selected {
            border-color: #3b82f6;
            background: #dbeafe;
        }

        .students-list {
            max-height: 150px;
            overflow-y: auto;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 10px;
            background: #f9fafb;
        }

        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
            margin-bottom: 5px;
            background: white;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
        }

        .race-controls {
            text-align: center;
            margin-bottom: 30px;
        }

        .race-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            margin: 0 10px;
        }

        .race-track {
            background: #22c55e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            min-height: 400px;
            border: 4px solid #16a34a;
        }

        .track-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .track-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .lanes {
            position: relative;
            min-height: 300px;
            height: auto;
        }

        .lane {
            height: 40px;
            margin-bottom: 8px;
            background: repeating-linear-gradient(
                90deg,
                #ffffff 0px,
                #ffffff 20px,
                #f3f4f6 20px,
                #f3f4f6 40px
            );
            border: 2px solid #374151;
            border-radius: 15px;
            position: relative;
            overflow: visible;
        }

        .start-line {
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #dc2626;
            z-index: 10;
        }

        .finish-line {
            position: absolute;
            right: 20px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #000000;
            z-index: 10;
        }

        .racer {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            transition: left 0.1s ease-out;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .racer-icon {
            font-size: 24px;
        }

        .racer-name {
            font-size: 16px;
            font-weight: bold;
            color: #1f2937;
            white-space: nowrap;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .winner-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .winner-content {
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 5px solid #d97706;
            position: relative;
            animation: bounce 0.6s ease-out;
        }

        @keyframes bounce {
            0% { transform: scale(0.3); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .winner-title {
            font-size: 3rem;
            font-weight: bold;
            color: #dc2626;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .winner-name {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ef4444;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .clouds {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            height: 60px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><circle cx="20" cy="10" r="8" fill="white" opacity="0.8"/><circle cx="15" cy="10" r="6" fill="white" opacity="0.8"/><circle cx="25" cy="10" r="6" fill="white" opacity="0.8"/><circle cx="70" cy="8" r="6" fill="white" opacity="0.6"/><circle cx="75" cy="8" r="4" fill="white" opacity="0.6"/><circle cx="65" cy="8" r="4" fill="white" opacity="0.6"/></svg>') repeat-x;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }
            
            .title {
                font-size: 1.8rem;
            }
            
            .icon-selector {
                grid-template-columns: repeat(6, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="clouds"></div>
        
        <header class="header">
            <h1 class="title">🏁 Perlumbaan Murid 🏁</h1>
            <p class="subtitle">SK Bukit Cermin 2025</p>
        </header>

        <div class="controls">
            <div class="control-section">
                <h3 class="control-title">👥 Tambah Nama Murid</h3>
                <div class="input-group">
                    <input type="text" id="studentName" placeholder="Masukkan nama murid..." maxlength="30">
                    <button class="btn btn-primary" onclick="addStudent()">Tambah</button>
                </div>
                
                <h4 class="control-title">🎯 Pilih Icon</h4>
                <div class="icon-selector">
                    <div class="icon-option selected" data-icon="🚗" onclick="selectIcon('🚗')">🚗</div>
                    <div class="icon-option" data-icon="🚲" onclick="selectIcon('🚲')">🚲</div>
                    <div class="icon-option" data-icon="🏃" onclick="selectIcon('🏃')">🏃</div>
                    <div class="icon-option" data-icon="🐎" onclick="selectIcon('🐎')">🐎</div>
                    <div class="icon-option" data-icon="🚀" onclick="selectIcon('🚀')">🚀</div>
                    <div class="icon-option" data-icon="🛴" onclick="selectIcon('🛴')">🛴</div>
                    <div class="icon-option" data-icon="🏍️" onclick="selectIcon('🏍️')">🏍️</div>
                    <div class="icon-option" data-icon="🚁" onclick="selectIcon('🚁')">🚁</div>
                    <div class="icon-option" data-icon="🍎" onclick="selectIcon('🍎')">🍎</div>
                    <div class="icon-option" data-icon="🍌" onclick="selectIcon('🍌')">🍌</div>
                    <div class="icon-option" data-icon="🍊" onclick="selectIcon('🍊')">🍊</div>
                    <div class="icon-option" data-icon="🍇" onclick="selectIcon('🍇')">🍇</div>
                    <div class="icon-option" data-icon="🐱" onclick="selectIcon('🐱')">🐱</div>
                    <div class="icon-option" data-icon="🐶" onclick="selectIcon('🐶')">🐶</div>
                    <div class="icon-option" data-icon="🐸" onclick="selectIcon('🐸')">🐸</div>
                    <div class="icon-option" data-icon="🐧" onclick="selectIcon('🐧')">🐧</div>
                </div>
            </div>

            <div class="control-section">
                <h3 class="control-title">📋 Senarai Murid (<span id="studentCount">0</span>/35)</h3>
                <div class="students-list" id="studentsList">
                    <p style="text-align: center; color: #6b7280; font-style: italic;">Belum ada murid didaftarkan</p>
                </div>
            </div>
        </div>

        <div class="race-controls">
            <button class="btn btn-success race-btn" onclick="startRace()" id="startBtn">🏁 Mula Perlumbaan</button>
            <button class="btn btn-danger race-btn" onclick="resetRace()">🔄 Set Semula</button>
        </div>

        <div class="race-track">
            <div class="track-header">
                <h2 class="track-title">🏟️ Trek Perlumbaan 🏟️</h2>
            </div>
            <div class="lanes" id="raceLanes">
                <div class="start-line"></div>
                <div class="finish-line"></div>
            </div>
        </div>
    </div>

    <div class="winner-popup" id="winnerPopup">
        <div class="winner-content">
            <h1 class="winner-title">🎉 TAHNIAH! 🎉</h1>
            <p class="winner-name" id="winnerName"></p>
            <p style="font-size: 1.2rem; color: #374151; margin-bottom: 20px;">Pemenang Perlumbaan!</p>
            <button class="btn btn-primary" onclick="closeWinnerPopup()">Tutup</button>
        </div>
    </div>

    <script>
        let students = [];
        let selectedIcon = '🚗';
        let raceInProgress = false;
        let raceInterval;

        function selectIcon(icon) {
            selectedIcon = icon;
            document.querySelectorAll('.icon-option').forEach(el => el.classList.remove('selected'));
            document.querySelector(`[data-icon="${icon}"]`).classList.add('selected');
        }

        function addStudent() {
            const nameInput = document.getElementById('studentName');
            const name = nameInput.value.trim();
            
            if (!name) {
                showMessage('Sila masukkan nama murid!', 'error');
                return;
            }
            
            if (students.length >= 35) {
                showMessage('Maksimum 35 murid sahaja!', 'error');
                return;
            }
            
            if (students.some(student => student.name.toLowerCase() === name.toLowerCase())) {
                showMessage('Nama murid sudah wujud!', 'error');
                return;
            }
            
            const student = {
                name: name,
                icon: selectedIcon,
                position: 0,
                id: Date.now()
            };
            
            students.push(student);
            nameInput.value = '';
            updateStudentsList();
            updateRaceTrack();
            showMessage(`${name} berjaya ditambah!`, 'success');
        }

        function removeStudent(id) {
            students = students.filter(student => student.id !== id);
            updateStudentsList();
            updateRaceTrack();
            showMessage('Murid dikeluarkan!', 'info');
        }

        function updateStudentsList() {
            const list = document.getElementById('studentsList');
            const count = document.getElementById('studentCount');
            
            count.textContent = students.length;
            
            if (students.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #6b7280; font-style: italic;">Belum ada murid didaftarkan</p>';
                return;
            }
            
            list.innerHTML = students.map(student => `
                <div class="student-item">
                    <span>${student.icon} ${student.name}</span>
                    <button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="removeStudent(${student.id})">Buang</button>
                </div>
            `).join('');
        }

        function updateRaceTrack() {
            const lanes = document.getElementById('raceLanes');
            const startLine = lanes.querySelector('.start-line');
            const finishLine = lanes.querySelector('.finish-line');
            
            lanes.innerHTML = '';
            lanes.appendChild(startLine);
            lanes.appendChild(finishLine);
            
            students.forEach((student, index) => {
                const lane = document.createElement('div');
                lane.className = 'lane';
                lane.innerHTML = `
                    <div class="racer" id="racer-${student.id}">
                        <span class="racer-name">${student.name}</span>
                        <span class="racer-icon">${student.icon}</span>
                    </div>
                `;
                lanes.appendChild(lane);
            });
        }

        function startRace() {
            if (students.length === 0) {
                showMessage('Tambah murid terlebih dahulu!', 'error');
                return;
            }
            
            if (raceInProgress) return;
            
            raceInProgress = true;
            document.getElementById('startBtn').textContent = '🏃 Perlumbaan Berlangsung...';
            document.getElementById('startBtn').disabled = true;
            
            // Reset positions
            students.forEach(student => {
                student.position = 0;
                const racer = document.getElementById(`racer-${student.id}`);
                if (racer) racer.style.left = '25px';
            });
            
            const trackWidth = document.querySelector('.lanes').offsetWidth - 80;
            
            raceInterval = setInterval(() => {
                let winner = null;
                
                students.forEach(student => {
                    const racer = document.getElementById(`racer-${student.id}`);
                    if (!racer) return;
                    
                    // Random movement between 1-8 pixels
                    const movement = Math.random() * 8 + 1;
                    student.position += movement;
                    
                    const newPosition = Math.min(student.position, trackWidth);
                    racer.style.left = (25 + newPosition) + 'px';
                    
                    // Check for winner
                    if (student.position >= trackWidth && !winner) {
                        winner = student;
                    }
                });
                
                if (winner) {
                    clearInterval(raceInterval);
                    raceInProgress = false;
                    document.getElementById('startBtn').textContent = '🏁 Mula Perlumbaan';
                    document.getElementById('startBtn').disabled = false;
                    showWinner(winner);
                }
            }, 100);
        }

        function resetRace() {
            if (raceInterval) {
                clearInterval(raceInterval);
            }
            
            raceInProgress = false;
            document.getElementById('startBtn').textContent = '🏁 Mula Perlumbaan';
            document.getElementById('startBtn').disabled = false;
            
            students.forEach(student => {
                student.position = 0;
                const racer = document.getElementById(`racer-${student.id}`);
                if (racer) racer.style.left = '25px';
            });
            
            showMessage('Perlumbaan telah di-set semula!', 'info');
        }

        function showWinner(winner) {
            document.getElementById('winnerName').textContent = winner.name;
            document.getElementById('winnerPopup').style.display = 'flex';
            createConfetti();
        }

        function closeWinnerPopup() {
            document.getElementById('winnerPopup').style.display = 'none';
        }

        function createConfetti() {
            const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 3 + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 3000);
                }, i * 100);
            }
        }

        function showMessage(message, type) {
            // Create a simple toast message
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 20px;
                border-radius: 8px;
                color: white;
                font-weight: bold;
                z-index: 1000;
                animation: slideIn 0.3s ease-out;
            `;
            
            switch(type) {
                case 'success':
                    toast.style.background = '#10b981';
                    break;
                case 'error':
                    toast.style.background = '#ef4444';
                    break;
                default:
                    toast.style.background = '#3b82f6';
            }
            
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Add CSS for toast animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
        `;
        document.head.appendChild(style);

        // Allow Enter key to add student
        document.getElementById('studentName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addStudent();
            }
        });
    </script>

</html>
